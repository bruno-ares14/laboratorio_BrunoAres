<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório de autenticação</title>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Laboratório de autenticação</h1>
    <p id="status">A sessão ainda não foi consultada.</p>
    
    <div style="margin-top: 20px;">
      <a href="/oauth/login/google">Entrar com Google</a><br><br>
      <a href="/oauth/login/github">Entrar com GitHub</a>
    </div>
    
    <form method="post" action="/oauth/logout" style="margin-top: 20px;">
      <button type="submit">Sair</button>
    </form>
  </main>
</body>
</html>
